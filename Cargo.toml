[package]
name = "mahoraga"
description = "expression language designed for data driven applications"
license = "MIT OR Apache-2.0"
keywords = ["expression", "templates"]
repository = "https://github.com/dog4ik/mahoraga"
version = "0.4.0"
edition = "2024"

[features]
serde_json = ["dep:serde_json"]
miette = ["dep:miette"]

[dependencies]
miette = { version = "7.6.0", optional = true }
serde_json = { version = "1", optional = true, features=["std"], default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
crossterm = "0.29.0"
miette = { version = "7.6.0", features = ["fancy"] }
ratatui = "0.30.2"
serde_json = "1"
ratatui-textarea = "0.9.2"

[[example]]
name = "basics"
required-features = ["miette"]
